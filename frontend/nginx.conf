server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Al usar una variable en proxy_pass, Nginx vuelve a
    # resolver "backend" en cada intervalo en lugar de guardar la IP del arranque,
    # así el proxy sigue funcionando si el backend se recrea o se escala.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:80;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
